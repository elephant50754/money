name: Stock Price Monitor

on:
  schedule:
    # 台灣時間 24 小時，每 15 分鐘執行一次
    - cron: '*/15 * * * *'
  workflow_dispatch:

# 關鍵：開啟 GitHub Repo 的寫入權限，讓 Actions 能自動儲存 last_state.json
permissions:
  contents: write

jobs:
  check-and-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Monitor Script
        env:
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: python monitor.py

      # 將比對狀態檔案提交保存回 Repo
      - name: Commit & Push state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update stock state cache" && git push)
